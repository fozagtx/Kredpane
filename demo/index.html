<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2-variations"); font-weight: 300 700; font-style: normal; }
      :root {
        --ground: #f3f3ef;
        --ink: #111111;
        --muted: rgba(0, 0, 0, 0.55);
        --lime: #d6ff34;
        --display: "Space Grotesk";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--display); color: var(--ink); background: var(--ground); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .inner { position: absolute; inset: 0; opacity: 0; }
      video, .still { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }

      .hook { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 140px; }
      .hook h1 { font-size: 78px; font-weight: 700; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase; max-width: 1560px; }
      .hook .items { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; }
      .hook .item { display: flex; align-items: baseline; gap: 22px; }
      .hook .num { font-size: 30px; font-weight: 700; background: var(--lime); padding: 2px 14px; }
      .hook .item p { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }

      .end { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 24px; }
      .end .mark { width: 96px; height: 96px; border-radius: 22px; background: var(--lime); display: grid; place-items: center; }
      .end .word { font-size: 62px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
      .end .url { font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
      .end .cta { margin-top: 6px; background: var(--lime); padding: 14px 26px; font-size: 19px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="80" data-width="1920" data-height="1080">

      <section id="hook" class="scene clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="inner">
          <div class="hook">
            <h1 id="h1">Three things happen when you sign something you did not read.</h1>
            <div class="items">
              <div id="i1" class="item"><span class="num">1</span><p>You agree to the version they can change later.</p></div>
              <div id="i2" class="item"><span class="num">2</span><p>You give up the right to sue.</p></div>
              <div id="i3" class="item"><span class="num">3</span><p>You pay to leave.</p></div>
            </div>
          </div>
        </div>
      </section>

      <section id="s1" class="scene clip" data-start="8" data-duration="10" data-track-index="1">
        <div class="inner">
          <video id="v1" class="clip" data-start="8" data-duration="10" src="assets/video/part1.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="s2" class="scene clip" data-start="18" data-duration="14" data-track-index="2">
        <div class="inner">
          <video id="v2" class="clip" data-start="18" data-duration="14" src="assets/video/part2.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="s3" class="scene clip" data-start="32" data-duration="22" data-track-index="3">
        <div class="inner">
          <video id="v3" class="clip" data-start="32" data-duration="22" src="assets/video/part3.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="mail" class="scene clip" data-start="54" data-duration="16" data-track-index="4">
        <div class="inner">
          <img id="mailimg" class="still" src="assets/email.png" alt="Kredpane drafting a pushback email" />
        </div>
      </section>

      <section id="endcard" class="scene clip" data-start="70" data-duration="10" data-track-index="5">
        <div class="inner">
          <div class="end">
            <div id="mark" class="mark">
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
                <g stroke="#111" stroke-width="2.4" stroke-linecap="square">
                  <path d="M6 3v18" /><path d="M6 12.4 17.4 3" /><path d="M6 11.6 18.4 21" />
                </g>
              </svg>
            </div>
            <div id="word" class="word">Kredpane</div>
            <div id="url" class="url">kredpane.vercel.app</div>
            <div id="cta" class="cta">Before you sign the next one.</div>
          </div>
        </div>
      </section>

      <audio id="bed" src="assets/music.m4a" data-start="0.6" data-duration="79.4"></audio>
      <audio id="vo" src="assets/vo.wav" data-start="2" data-duration="73.15"></audio>
      <audio id="w1" src="assets/sfx-whoosh.wav" data-start="8" data-duration="0.4"></audio>
      <audio id="w2" src="assets/sfx-whoosh.wav" data-start="18" data-duration="0.4"></audio>
      <audio id="w3" src="assets/sfx-whoosh.wav" data-start="32" data-duration="0.4"></audio>
      <audio id="w4" src="assets/sfx-whoosh.wav" data-start="54" data-duration="0.4"></audio>
      <audio id="w5" src="assets/sfx-whoosh.wav" data-start="70" data-duration="0.4"></audio>
      <audio id="click1" src="assets/sfx-click.wav" data-start="27.7" data-duration="0.2"></audio>
      <audio id="chime1" src="assets/sfx-chime.wav" data-start="56.2" data-duration="0.32"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const scenes = [
        ["#hook", 0, 8],
        ["#s1", 8, 10],
        ["#s2", 18, 14],
        ["#s3", 32, 22],
        ["#mail", 54, 16],
        ["#endcard", 70, 10]
      ];

      scenes.forEach(([sel, start, dur]) => {
        tl.set(`${sel} .inner`, { opacity: 1 }, start);
        tl.set(`${sel} .inner`, { opacity: 0 }, start + dur - 0.02);
      });

      tl.fromTo("#h1", { opacity: 0, filter: "blur(10px)", y: 20 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#i1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.1);
      tl.fromTo("#i2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.4);
      tl.fromTo("#i3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.6);

      tl.fromTo("#mailimg", { scale: 1.0 }, { scale: 1.05, duration: 15.5, ease: "none" }, 54.2);

      tl.fromTo("#mark", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 70.4);
      tl.fromTo("#word", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 70.75);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 71.2);
      tl.fromTo("#cta", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 71.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
