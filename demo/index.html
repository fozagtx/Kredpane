<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2-variations"); font-weight: 300 700; font-style: normal; }
      :root {
        --ground: #f3f3ef;
        --ink: #111111;
        --muted: rgba(0, 0, 0, 0.55);
        --lime: #d6ff34;
        --display: "Space Grotesk";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--display); color: var(--ink); background: var(--ground); }
      .scene { position: absolute; inset: 0; }
      .inner { position: absolute; inset: 0; opacity: 0; }
      video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }

      .hook { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 160px; }
      .hook h1 { font-size: 86px; font-weight: 700; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase; max-width: 1500px; }
      .hook .l2 { margin-top: 14px; }
      .hook .l2 span { background: var(--lime); padding: 4px 20px; display: inline-block; }

      .end { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 24px; }
      .end .mark { width: 96px; height: 96px; border-radius: 22px; background: var(--lime); display: grid; place-items: center; }
      .end .word { font-size: 62px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
      .end .url { font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
      .end .cta { margin-top: 6px; background: var(--lime); padding: 14px 26px; font-size: 19px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">

      <section id="hook" class="scene clip" data-start="0" data-duration="6.2" data-track-index="0">
        <div class="inner">
          <div class="hook">
            <h1 id="h1">Every day, people sign contracts they have never read.</h1>
            <h1 id="h2" class="l2"><span>A lease. A gym. A phone plan.</span></h1>
          </div>
        </div>
      </section>

      <section id="s1" class="scene clip" data-start="6.2" data-duration="10" data-track-index="1">
        <div class="inner">
          <video id="v1" class="clip" data-start="6.2" data-duration="10" src="assets/video/part1.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="s2" class="scene clip" data-start="16.2" data-duration="14" data-track-index="2">
        <div class="inner">
          <video id="v2" class="clip" data-start="16.2" data-duration="14" src="assets/video/part2.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="s3" class="scene clip" data-start="30.2" data-duration="23.8" data-track-index="3">
        <div class="inner">
          <video id="v3" class="clip" data-start="30.2" data-duration="23.8" src="assets/video/part3.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="endcard" class="scene clip" data-start="54" data-duration="6" data-track-index="4">
        <div class="inner">
          <div class="end">
            <div id="mark" class="mark">
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
                <g stroke="#111" stroke-width="2.4" stroke-linecap="square">
                  <path d="M6 3v18" /><path d="M6 12.4 17.4 3" /><path d="M6 11.6 18.4 21" />
                </g>
              </svg>
            </div>
            <div id="word" class="word">Kredpane</div>
            <div id="url" class="url">kredpane.vercel.app</div>
            <div id="cta" class="cta">Paste a contract. Read it in a minute.</div>
          </div>
        </div>
      </section>

      <audio id="vo" src="assets/vo.wav" data-start="1.6" data-duration="55.47"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const scenes = [
        ["#hook", 0, 6.2],
        ["#s1", 6.2, 10],
        ["#s2", 16.2, 14],
        ["#s3", 30.2, 23.8],
        ["#endcard", 54, 6]
      ];

      scenes.forEach(([sel, start, dur]) => {
        tl.set(`${sel} .inner`, { opacity: 1 }, start);
        tl.set(`${sel} .inner`, { opacity: 0 }, start + dur - 0.02);
      });

      tl.fromTo("#h1", { opacity: 0, filter: "blur(10px)", y: 18 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#h2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.6);
      tl.fromTo("#h2 span", { scaleX: 0.3, opacity: 0, transformOrigin: "left center" }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.6);

      tl.fromTo("#mark", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 54.3);
      tl.fromTo("#word", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 54.65);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 55.1);
      tl.fromTo("#cta", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 55.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
