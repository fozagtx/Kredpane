<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-500.woff2") format("woff2"); font-weight: 500; }
      :root {
        --ground: #f3f3ef;
        --ink: #111111;
        --muted: #5b5b5b;
        --hair: rgba(25, 25, 25, 0.12);
        --lime: #d6ff34;
        --font-display: "Instrument Serif";
        --font-ui: "Geist";
        --font-mono: "Geist Mono";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-ui); color: var(--ink); background: var(--ground); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .inner { position: absolute; inset: 0; opacity: 0; }
      video, .still { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }

      .hook { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 140px; }
      .hook-eyebrow {
        font-family: var(--font-mono); font-size: 22px; font-weight: 500; letter-spacing: 0.15em;
        text-transform: uppercase; color: var(--muted); margin-bottom: 30px; display: flex; align-items: center; gap: 14px;
      }
      .hook-eyebrow i { display: block; width: 34px; height: 1px; background: currentColor; font-style: normal; }
      .hook-title {
        font-family: var(--font-display); font-weight: 400; font-size: 112px; line-height: 1.02;
        letter-spacing: -0.028em; color: var(--ink); max-width: 1500px;
      }
      .stat { color: var(--ink); }

      .end { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 22px; }
      .end .mark { width: 92px; height: 92px; border-radius: 20px; background: var(--lime); display: grid; place-items: center; }
      .end .word { font-family: var(--font-display); font-size: 96px; font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
      .end .url {
        font-family: var(--font-mono); font-size: 20px; font-weight: 500; letter-spacing: 0.15em;
        text-transform: uppercase; color: var(--muted);
      }
      .end .stack {
        font-family: var(--font-mono); font-size: 16px; font-weight: 500; letter-spacing: 0.15em;
        text-transform: uppercase; color: #3d5500;
      }
      .end .cta {
        margin-top: 10px; font-family: var(--font-mono); font-size: 19px; font-weight: 500; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--ink); border-bottom: 1px solid var(--hair); padding-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="80" data-width="1920" data-height="1080">

      <section id="hook1" class="scene clip" data-start="0" data-duration="3.4" data-track-index="0">
        <div class="inner">
          <div class="hook">
            <div id="eyebrow" class="hook-eyebrow"><i></i>The shift</div>
            <h1 id="h1" class="hook-title">In 2017, researchers built a fake social network.</h1>
          </div>
        </div>
      </section>

      <section id="hook2" class="scene clip" data-start="3.4" data-duration="3.4" data-track-index="0">
        <div class="inner">
          <div class="hook">
            <h1 id="h2" class="hook-title">Buried in the terms: your firstborn child.</h1>
          </div>
        </div>
      </section>

      <section id="hook3" class="scene clip" data-start="6.8" data-duration="2.8" data-track-index="0">
        <div class="inner">
          <div class="hook">
            <h1 id="h3" class="hook-title">98% of people clicked agree.</h1>
          </div>
        </div>
      </section>

      <section id="s1" class="scene clip" data-start="9.6" data-duration="10" data-track-index="1">
        <div class="inner">
          <video id="v1" class="clip" data-start="9.6" data-duration="10" src="assets/video/part1.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="s2" class="scene clip" data-start="19.6" data-duration="12.4" data-track-index="2">
        <div class="inner">
          <video id="v2" class="clip" data-start="19.6" data-duration="12.4" src="assets/video/part2.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="s3" class="scene clip" data-start="32" data-duration="22" data-track-index="3">
        <div class="inner">
          <video id="v3" class="clip" data-start="32" data-duration="22" src="assets/video/part3.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <section id="mail" class="scene clip" data-start="54" data-duration="16" data-track-index="4">
        <div class="inner">
          <img id="mailimg" class="still" src="assets/email.png" alt="Kredpane drafting a pushback email" />
        </div>
      </section>

      <section id="endcard" class="scene clip" data-start="70" data-duration="10" data-track-index="5">
        <div class="inner">
          <div class="end">
            <div id="mark" class="mark">
              <svg width="50" height="50" viewBox="0 0 24 24" fill="none">
                <g stroke="#111" stroke-width="2.4" stroke-linecap="square">
                  <path d="M6 3v18" /><path d="M6 12.4 17.4 3" /><path d="M6 11.6 18.4 21" />
                </g>
              </svg>
            </div>
            <div id="word" class="word">Kredpane</div>
            <div id="url" class="url">kredpane.vercel.app</div>
            <div id="stack" class="stack">SERV Reasoning · Reppo</div>
            <div id="cta" class="cta">Read it before you sign</div>
          </div>
        </div>
      </section>

      <audio id="bed" src="assets/music.m4a" data-start="0.6" data-duration="79.4"></audio>
      <audio id="vo" src="assets/vo.wav" data-start="1.5" data-duration="74.71"></audio>
      <audio id="w1" src="assets/sfx-whoosh.wav" data-start="9.6" data-duration="0.4"></audio>
      <audio id="w2" src="assets/sfx-whoosh.wav" data-start="19.6" data-duration="0.4"></audio>
      <audio id="w3" src="assets/sfx-whoosh.wav" data-start="32" data-duration="0.4"></audio>
      <audio id="w4" src="assets/sfx-whoosh.wav" data-start="54" data-duration="0.4"></audio>
      <audio id="w5" src="assets/sfx-whoosh.wav" data-start="70" data-duration="0.4"></audio>
      <audio id="click1" src="assets/sfx-click.wav" data-start="29.3" data-duration="0.2"></audio>
      <audio id="chime1" src="assets/sfx-chime.wav" data-start="56.2" data-duration="0.32"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const scenes = [
        ["#hook1", 0, 3.4],
        ["#hook2", 3.4, 3.4],
        ["#hook3", 6.8, 2.8],
        ["#s1", 9.6, 10],
        ["#s2", 19.6, 12.4],
        ["#s3", 32, 22],
        ["#mail", 54, 16],
        ["#endcard", 70, 10]
      ];

      scenes.forEach(([sel, start, dur]) => {
        tl.set(`${sel} .inner`, { opacity: 1 }, start);
        tl.set(`${sel} .inner`, { opacity: 0 }, start + dur - 0.02);
      });

      tl.fromTo("#eyebrow", { y: 6 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#h1", { filter: "blur(6px)", y: 8 }, { filter: "blur(0px)", y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#h2", { filter: "blur(6px)", y: 8 }, { filter: "blur(0px)", y: 0, duration: 0.35, ease: "power3.out" }, 3.42);
      tl.fromTo("#h3", { filter: "blur(6px)", y: 8 }, { filter: "blur(0px)", y: 0, duration: 0.35, ease: "power3.out" }, 6.82);

      tl.fromTo("#mailimg", { scale: 1.0 }, { scale: 1.05, duration: 15.5, ease: "none" }, 54.2);

      tl.fromTo("#mark", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 70.4);
      tl.fromTo("#word", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 70.7);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 71.2);
      tl.fromTo("#stack", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 71.5);
      tl.fromTo("#cta", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 71.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
