<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2-variations"); font-weight: 300 700; font-style: normal; }
      :root {
        --ground: #f3f3ef;
        --ink: #111111;
        --muted: rgba(0, 0, 0, 0.55);
        --lime: #d6ff34;
        --display: "Space Grotesk";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--display); color: var(--ink); background: var(--ground); }
      .scene { position: absolute; inset: 0; }
      .inner { position: absolute; inset: 0; opacity: 0; }
      .shot { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .cap {
        position: absolute; left: 96px; bottom: 72px;
        font-size: 20px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--ink); background: var(--lime); padding: 10px 16px;
      }
      .cursor { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 6px rgba(17,17,17,0.12); left: 0; top: 0; }
      .ring { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--ink); left: 0; top: 0; opacity: 0; }
      .hook { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
      .hook h1 { font-size: 104px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em; text-transform: uppercase; }
      .hook .l2 { margin-top: 10px; }
      .hook .l2 span { background: var(--lime); padding: 4px 22px; display: inline-block; }
      .end { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 26px; }
      .end .mark { width: 96px; height: 96px; border-radius: 22px; background: var(--lime); display: grid; place-items: center; }
      .end .word { font-size: 64px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
      .end .url { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .end .cta { margin-top: 8px; background: var(--lime); padding: 14px 26px; font-size: 20px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      .sweep { position: absolute; left: 632px; top: 300px; width: 620px; height: 64px; background: rgba(214,255,52,0.55); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <section id="hook" class="scene clip" data-start="0" data-duration="9" data-track-index="0">
        <div class="inner">
          <div class="hook">
            <h1 id="h1">You hate reading</h1>
            <h1 id="h2" class="l2">terms of service.</h1>
            <h1 id="h3" class="l2"><span>We know.</span></h1>
          </div>
        </div>
      </section>

      <section id="landing" class="scene clip" data-start="9" data-duration="4.8" data-track-index="1">
        <div class="inner">
          <img class="shot" src="assets/landing.png" alt="Kredpane landing page" />
          <div class="cap">One button, no sign-up</div>
          <div id="cur1" class="cursor"></div>
          <div id="ring1" class="ring"></div>
        </div>
      </section>

      <section id="scan" class="scene clip" data-start="13.8" data-duration="12.4" data-track-index="2">
        <div class="inner">
          <img class="shot" src="assets/scan.png" alt="Kredpane scan form with a contract pasted" />
          <div class="cap">Paste it, or upload the PDF</div>
          <div id="cur2" class="cursor"></div>
          <div id="ring2" class="ring"></div>
        </div>
      </section>

      <section id="dash" class="scene clip" data-start="26.2" data-duration="15.8" data-track-index="3">
        <div class="inner">
          <img class="shot" src="assets/dashboard.png" alt="Kredpane results: risk 100 down to 35" />
          <div class="cap">Risk falls, and every fee survives</div>
          <div id="sweep" class="sweep"></div>
        </div>
      </section>

      <section id="mail" class="scene clip" data-start="42" data-duration="11" data-track-index="4">
        <div class="inner">
          <img class="shot" src="assets/email.png" alt="Drafted pushback email for one unfair clause" />
          <div class="cap">Then send them a letter</div>
          <div id="cur3" class="cursor"></div>
          <div id="ring3" class="ring"></div>
        </div>
      </section>

      <section id="endcard" class="scene clip" data-start="53" data-duration="7" data-track-index="5">
        <div class="inner">
          <div class="end">
            <div id="mark" class="mark">
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
                <g stroke="#111" stroke-width="2.4" stroke-linecap="square">
                  <path d="M6 3v18" /><path d="M6 12.4 17.4 3" /><path d="M6 11.6 18.4 21" />
                </g>
              </svg>
            </div>
            <div id="word" class="word">Kredpane</div>
            <div id="url" class="url">kredpane.vercel.app</div>
            <div id="cta" class="cta">Paste a contract. Read it in a minute.</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const scenes = [
        ["#hook", 0, 9],
        ["#landing", 9, 4.8],
        ["#scan", 13.8, 12.4],
        ["#dash", 26.2, 15.8],
        ["#mail", 42, 11],
        ["#endcard", 53, 7]
      ];

      scenes.forEach(([sel, start, dur]) => {
        tl.set(`${sel} .inner`, { opacity: 1 }, start);
        tl.set(`${sel} .inner`, { opacity: 0 }, start + dur - 0.02);
      });

      tl.fromTo("#h1", { opacity: 0, filter: "blur(10px)", y: 18 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power4.out" }, 0.25);
      tl.fromTo("#h2", { opacity: 0, filter: "blur(10px)", y: 18 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power4.out" }, 0.55);
      tl.fromTo("#h3", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.15);
      tl.fromTo("#h3 span", { scaleX: 0.2, opacity: 0, transformOrigin: "left center" }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, 1.15);

      tl.set("#cur1", { x: 1740, y: 980 }, 9.1);
      tl.to("#cur1", { x: 859, y: 575, duration: 0.9, ease: "power2.inOut" }, 10.1);
      tl.fromTo("#ring1", { opacity: 0, scale: 0.4, x: 814, y: 530 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, 11.05);
      tl.to("#ring1", { opacity: 0, scale: 1.4, duration: 0.25, ease: "power2.in" }, 11.3);

      tl.set("#cur2", { x: 1600, y: 940 }, 14);
      tl.to("#cur2", { x: 1060, y: 819, duration: 0.8, ease: "power2.inOut" }, 23.2);
      tl.fromTo("#ring2", { opacity: 0, scale: 0.4, x: 1015, y: 774 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, 24.1);
      tl.to("#ring2", { opacity: 0, scale: 1.4, duration: 0.25, ease: "power2.in" }, 24.35);

      tl.fromTo("#sweep", { opacity: 0, y: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 29);
      tl.to("#sweep", { y: 300, duration: 3.6, ease: "none" }, 29.3);
      tl.to("#sweep", { opacity: 0, duration: 0.4, ease: "power2.in" }, 32.6);

      tl.set("#cur3", { x: 1500, y: 900 }, 42.6);
      tl.to("#cur3", { x: 463, y: 657, duration: 0.9, ease: "power2.inOut" }, 43.6);
      tl.fromTo("#ring3", { opacity: 0, scale: 0.4, x: 418, y: 612 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, 44.6);
      tl.to("#ring3", { opacity: 0, scale: 1.4, duration: 0.25, ease: "power2.in" }, 44.85);

      tl.fromTo("#mark", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 53.2);
      tl.fromTo("#word", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 53.55);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 54);
      tl.fromTo("#cta", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 54.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
